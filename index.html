<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>视频通话</title>
  <script src="https://web.sdk.qcloud.com/trtc/webrtc/v5/dist/trtc.js"></script>
  <script src="https://unpkg.com/@tencentcloud/chat@3/index.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #remote { position: fixed; inset: 0; background: #111; }
    #local { position: fixed; top: 16px; right: 16px; width: 96px; height: 144px; background: #222; border-radius: 8px; overflow: hidden; z-index: 2; }
    #panel { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #000; padding: 24px; overflow-y: auto; }
    #panel input { width: 100%; max-width: 360px; font-size: 17px; padding: 13px; border-radius: 8px; border: none; }
    #panel button, #hangup { font-size: 24px; padding: 20px 48px; border: none; border-radius: 12px; color: #fff; background: #43A047; }
    #hangup { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #E53935; z-index: 2; display: none; }
    #status { font-size: 15px; color: #aaa; min-height: 20px; text-align: center; max-width: 360px; }
    label { align-self: flex-start; max-width: 360px; width: 100%; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <div id="remote"></div>
  <div id="local"></div>
  <button id="hangup">挂断</button>

  <div id="panel">
    <h2>视频通话</h2>
    <label>SDKAppID</label>
    <input id="sdkappid" placeholder="腾讯云 SDKAppID（数字）" inputmode="numeric" autocomplete="off" />
    <label>UserSig（控制台为 userId=web 生成）</label>
    <input id="usersig" placeholder="UserSig" autocomplete="off" />
    <label>房间号</label>
    <input id="room" value="kiosktest" autocomplete="off" />
    <button id="call">呼叫</button>
    <div id="status"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    if (q.get('sdkappid')) $('sdkappid').value = q.get('sdkappid');
    if (q.get('usersig')) $('usersig').value = q.get('usersig');
    if (q.get('room')) $('room').value = q.get('room');

    const WEB_USER_ID = 'web';
    const DEVICE_USER_ID = 'device';
    let trtc = null, chat = null, sdkAppId = 0, userSig = '', room = 'kiosktest';

    function setStatus(t) { $('status').textContent = t; }

    async function ensureChatReady() {
      chat = TencentCloudChat.create({ SDKAppID: sdkAppId });
      const ready = new Promise((res) => chat.on(TencentCloudChat.EVENT.SDK_READY, res));
      await chat.login({ userID: WEB_USER_ID, userSig });
      await ready;
    }

    async function sendSignal(type) {
      if (!chat) return;
      const msg = chat.createCustomMessage({
        to: DEVICE_USER_ID,
        conversationType: TencentCloudChat.TYPES.CONV_C2C,
        payload: { data: JSON.stringify({ type, room }) },
      });
      await chat.sendMessage(msg);
    }

    async function call() {
      sdkAppId = parseInt($('sdkappid').value.trim(), 10);
      userSig = $('usersig').value.trim();
      room = $('room').value.trim() || 'kiosktest';
      if (!sdkAppId || !userSig) { setStatus('请填写 SDKAppID 和 UserSig'); return; }

      try {
        setStatus('正在呼叫设备…');
        await ensureChatReady();
        await sendSignal('call');

        trtc = TRTC.create();
        trtc.on(TRTC.EVENT.REMOTE_VIDEO_AVAILABLE, ({ userId, streamType }) => {
          trtc.startRemoteVideo({ userId, streamType, view: 'remote' });
          setStatus('');
        });
        trtc.on(TRTC.EVENT.REMOTE_USER_EXIT, () => { $('remote').innerHTML = ''; });

        await trtc.enterRoom({ sdkAppId, userId: WEB_USER_ID, userSig, strRoomId: room });
        await trtc.startLocalVideo({ view: 'local' });
        await trtc.startLocalAudio();

        $('panel').style.display = 'none';
        $('hangup').style.display = 'block';
        setStatus('呼叫中，等待接听…');
      } catch (e) {
        setStatus('失败：' + (e && e.message ? e.message : e));
      }
    }

    async function hangup() {
      try { await sendSignal('cancel'); } catch (e) { /* ignore */ }
      try {
        if (trtc) {
          await trtc.stopLocalVideo();
          await trtc.stopLocalAudio();
          await trtc.exitRoom();
          trtc = null;
        }
      } catch (e) { /* ignore */ }
      try { if (chat) { await chat.logout(); chat = null; } } catch (e) { /* ignore */ }
      $('remote').innerHTML = '';
      $('local').innerHTML = '';
      $('hangup').style.display = 'none';
      $('panel').style.display = 'flex';
      setStatus('已挂断');
    }

    $('call').onclick = call;
    $('hangup').onclick = hangup;
  </script>
</body>
</html>
