<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>视频通话</title>
  <script src="https://web.sdk.qcloud.com/trtc/webrtc/v5/dist/trtc.js"></script>
  <script src="https://unpkg.com/@tencentcloud/chat@3/index.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #remote { position: fixed; inset: 0; background: #111; }
    #local { position: fixed; top: 16px; right: 16px; width: 96px; height: 144px; background: #222; border-radius: 8px; overflow: hidden; z-index: 2; }
    #panel { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #000; padding: 24px; }
    #call, #hangup { font-size: 30px; padding: 28px 72px; border: none; border-radius: 16px; color: #fff; background: #43A047; }
    #hangup { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #E53935; z-index: 2; display: none; }
    #status { font-size: 15px; color: #aaa; min-height: 20px; text-align: center; max-width: 360px; }
    h2 { font-weight: 600; font-size: 26px; text-align: center; }
  </style>
</head>
<body>
  <div id="remote"></div>
  <div id="local"></div>
  <button id="hangup">挂断</button>

  <div id="panel">
    <h2 id="title">给家人打视频电话</h2>
    <button id="call">呼　叫</button>
    <div id="status"></div>
  </div>

  <script>
    const SDK_APP_ID = 1600154053;
    const DEVICE_USER_ID = 'device';

    const $ = (id) => document.getElementById(id);
    const p = new URLSearchParams(location.search);
    const userId = p.get('uid');
    const userSig = p.get('sig');
    const displayName = p.get('name') || '家人';
    $('title').textContent = displayName + '，给家人打电话';

    let trtc = null, chat = null, room = '';

    function setStatus(t) { $('status').textContent = t; }

    async function call() {
      if (!userId || !userSig) { setStatus('链接无效：缺少身份信息'); return; }
      try {
        setStatus('正在连接…');
        room = 'r' + Math.floor(Math.random() * 1e9); // 每次呼叫独立房间

        chat = TencentCloudChat.create({ SDKAppID: SDK_APP_ID });
        const ready = new Promise((res) => chat.on(TencentCloudChat.EVENT.SDK_READY, res));
        await chat.login({ userID: userId, userSig });
        await ready;

        const msg = chat.createCustomMessage({
          to: DEVICE_USER_ID,
          conversationType: TencentCloudChat.TYPES.CONV_C2C,
          payload: { data: JSON.stringify({ type: 'call', room, name: displayName }) },
        });
        await chat.sendMessage(msg);

        trtc = TRTC.create();
        trtc.on(TRTC.EVENT.REMOTE_VIDEO_AVAILABLE, ({ userId: u, streamType }) => {
          trtc.startRemoteVideo({ userId: u, streamType, view: 'remote' });
          setStatus('');
        });
        trtc.on(TRTC.EVENT.REMOTE_USER_EXIT, () => { $('remote').innerHTML = ''; });
        await trtc.enterRoom({ sdkAppId: SDK_APP_ID, userId, userSig, strRoomId: room });
        await trtc.startLocalVideo({ view: 'local' });
        await trtc.startLocalAudio();

        $('panel').style.display = 'none';
        $('hangup').style.display = 'block';
        setStatus('呼叫中，等待接听…');
      } catch (e) {
        setStatus('失败：' + (e && e.message ? e.message : e));
      }
    }

    async function sendSignal(type) {
      if (!chat) return;
      const msg = chat.createCustomMessage({
        to: DEVICE_USER_ID,
        conversationType: TencentCloudChat.TYPES.CONV_C2C,
        payload: { data: JSON.stringify({ type, room }) },
      });
      await chat.sendMessage(msg);
    }

    async function hangup() {
      try { await sendSignal('cancel'); } catch (e) {}
      try {
        if (trtc) { await trtc.stopLocalVideo(); await trtc.stopLocalAudio(); await trtc.exitRoom(); trtc = null; }
      } catch (e) {}
      try { if (chat) { await chat.logout(); chat = null; } } catch (e) {}
      $('remote').innerHTML = '';
      $('local').innerHTML = '';
      $('hangup').style.display = 'none';
      $('panel').style.display = 'flex';
      setStatus('已挂断');
    }

    $('call').onclick = call;
    $('hangup').onclick = hangup;
  </script>
</body>
</html>
